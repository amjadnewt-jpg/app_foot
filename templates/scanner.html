<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner QR</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 30px;
            background: #f5f5f5;
        }

        #reader {
            width: 350px;
            margin: auto;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>

    <h2>📷 Scanner un billet</h2>

    <div id="reader"></div>

    <p id="result"></p>

    <script>
        function onScanSuccess(decodedText) {

            document.getElementById("result").innerText =
                "QR détecté : " + decodedText;

            // Stop le scanner pour éviter les doubles scans
            scanner.clear();

            // Si le QR contient déjà une URL complète
            if (
                decodedText.startsWith("http://") ||
                decodedText.startsWith("https://")
            ) {
                window.location.href = decodedText;
            } else {
                window.location.href = "/scan/" + decodedText;
            }
        }

        let scanner = new Html5QrcodeScanner(
            "reader",
            {
                fps: 10,
                qrbox: 250
            }
        );

        scanner.render(onScanSuccess);
    </script>

</body>
</html>
